<!DOCTYPE html>
<html lang="{{lang}}"><head><meta charset="UTF-8"><title>{{title}} {{reference}}</title><style>body { font-family: 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; font-size: 9pt; color:#1e293b; background:#ffffff; margin:0; } table { border-collapse:collapse; width:100%; } th,td { padding:10px 8px; } .document { padding:16px; } h1 { font-size:22px; margin:8px 0; color:#0f172a; } .meta { color:#64748b; margin:4px 0 18px; } .footer { margin-top:24px; color:#64748b; font-size:9px; } thead { display:table-header-group; } tr { page-break-inside:avoid; } @page { size:A4; margin:12mm; } @media print { body { margin:0; } .document { padding:0; } }</style></head>
<body><div class="document"><h1>{{title}} {{reference}}</h1><p class="meta">{{date}}</p>
<p style="padding:12px;background-color:#eff6ff;border-left:4px solid #2563eb;">{{summary}}</p>
<table width="100%" style="width:100%;border-collapse:collapse;"><thead>{{table_head}}</thead><tbody>{{rows}}</tbody></table>
<p class="footer">{{footer}}</p></div></body></html>
