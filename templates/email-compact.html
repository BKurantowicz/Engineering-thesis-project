<!DOCTYPE html>
<html lang="{{lang}}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title></head>
<body style="margin:0;padding:24px 12px;background-color:#f4f6f8;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1e293b;">
<table role="presentation" width="100%" style="width:100%;border-collapse:collapse;"><tr><td align="center" style="padding:0;">
<table role="presentation" width="600" style="width:100%;max-width:600px;border-collapse:collapse;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
<tr><td style="padding:16px;border-top:6px solid #2563eb;"><p style="margin:0 0 8px;color:#64748b;font-size:12px;">{{reference}}</p><h1 style="margin:0;color:#0f172a;font-size:22px;">{{title}}</h1><p style="font-size:14px;line-height:1.6;">{{intro}}</p>{{tracking}}</td></tr>
<tr><td style="padding:0 16px 16px;"><table width="100%" style="width:100%;border-collapse:collapse;font-size:12px;"><thead>{{table_head}}</thead><tbody>{{rows}}</tbody></table><div style="margin-top:16px;">{{summary}}</div>{{parties}}</td></tr>
<tr><td style="padding:16px;border-top:1px solid #e2e8f0;background-color:#f8fafc;color:#64748b;font-size:12px;line-height:1.6;">{{footer}}</td></tr>
</table></td></tr></table></body></html>
